# Expanded by install.sh and installed as the com.openai.codex managed
# preference on macOS. Codex runs no hook: the git rule lives in
# rules/git.rules and AGENTS.md, as in the other homes. With no managed hook,
# this setting stops a hook in any other config from running.
allow_managed_hooks_only = true
# Interactive sessions use on-request; explicitly requested unattended work can use never.
allowed_approval_policies = ["on-request", "never"]
