allow = [
  "Bash(git status)",
  "Bash(git diff *)",
  "Bash(git log *)",
  "Bash(git show *)",
  "Bash(git add *)",
  "Bash(shellcheck *)",
  "Bash(shfmt *)",
  "Bash(zsh -n *)",
]

# xAI plugin marketplace (Grok manages this block at runtime; kept so a fresh
# sync does not trigger re-detection on next launch).
[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"
