  "Bash(git push *--delete*)",
  "Bash(git -* push *--delete*)",
  "Bash(git push -d*)",
  "Bash(git -* push -d*)",
  "Bash(git push * -d*)",
  "Bash(git -* push * -d*)",
  "Bash(git push *--mirror*)",
  "Bash(git -* push *--mirror*)",
  "Bash(git push *--prune*)",
  "Bash(git -* push *--prune*)",
  "Bash(git push* :?*)",
  "Bash(git -* push* :?*)",
  "Bash(git fetch *--force*)",
  "Bash(git -* fetch *--force*)",
  "Bash(git fetch -f*)",
  "Bash(git -* fetch -f*)",
  "Bash(git fetch * -f*)",
  "Bash(git -* fetch * -f*)",
  "Bash(git fetch * +*)",
  "Bash(git -* fetch * +*)",
  "Bash(gh pr checkout *)",
  "Bash(gh pr co *)",
  "Bash(gh pr merge*)",
  "Bash(gh pr close -d*)",
  "Bash(gh pr close * -d*)",
  "Bash(gh pr close *--delete-branch*)",
  "Bash(gh repo sync*)",
  "Bash(gh repo delete*)",
  "Bash(gh repo archive*)",
  "Bash(gh repo rename*)",
  "Bash(gh release delete*)",
  "Bash(gh api *DELETE*)",
  "Bash(wt switch *)",
  "Bash(wt -* switch *)",
  "Bash(wt remove*)",
  "Bash(wt -* remove*)",
