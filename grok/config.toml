  "Bash(git tag * -d*)",
  "Bash(git -* tag * -d*)",
  "Bash(git tag -f*)",
  "Bash(git -* tag -f*)",
  "Bash(git tag * -f*)",
  "Bash(git -* tag * -f*)",
  "Bash(git tag *--delete*)",
  "Bash(git -* tag *--delete*)",
  "Bash(git tag *--force*)",
  "Bash(git -* tag *--force*)",
  "Bash(git checkout *)",
