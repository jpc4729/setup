  "Bash(git -* pull -r*)",
  "Bash(git pull * -r*)",
  "Bash(git -* pull * -r*)",
  "Bash(git * --abort)",
  "Bash(git filter-branch*)",
  "Bash(git -* filter-branch*)",
  "Bash(git filter-repo*)",
  "Bash(git -* filter-repo*)",
